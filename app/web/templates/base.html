<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Waste Monitor{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script>window.WASTE_WEIGHT = { symbol: "{{ w_symbol }}", divisor: {{ w_divisor }}, decimals: {{ w_decimals }} };</script>
</head>
<body>
<header>
  <h1>♻️ Waste Monitor</h1>
  <nav>
    <a href="{{ url_for('dashboard') }}">Dashboard</a>
    <a href="{{ url_for('analytics') }}">Analytics</a>
    <a href="{{ url_for('api_events_csv') }}">Export CSV</a>
    {% if session.get('admin_logged_in') %}
      <a href="{{ url_for('settings') }}">Settings</a>
      <form method="post" action="{{ url_for('logout') }}" class="nav-logout-form">
        <button type="submit" class="nav-logout-btn">Logout</button>
      </form>
    {% else %}
      <a href="{{ url_for('login') }}">Settings</a>
    {% endif %}
  </nav>
</header>
<main>{% block content %}{% endblock %}</main>
{% block scripts %}{% endblock %}
</body>
</html>
